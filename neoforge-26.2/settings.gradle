import org.gradle.api.initialization.resolve.RepositoriesMode

pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

// PREFER_PROJECT: 项目级仓库（含 NeoGradle 内部 Ivy 仓库，selectRawArtifact 产物所在）
// 优先于本处声明。PREFER_SETTINGS 会把 NeoGradle 注入的 Ivy 仓库一并排除，
// 导致 compileClasspath 找不到 ng_dummy_ng.net.neoforged:neoforge 内部产物。
dependencyResolutionManagement {
    repositoriesMode = RepositoriesMode.PREFER_PROJECT
    repositories {
        mavenCentral()
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://libraries.minecraft.net/' }
    }
}

rootProject.name = 'OpenLumin-neoforge-26.2'
