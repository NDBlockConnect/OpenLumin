plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'OpenLumin-neoforge-26.2'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

runs {
    configureEach {
        systemProperty 'forge.logging.console.level', 'debug'
        workingDirectory project.layout.projectDirectory.dir('run').dir(name)
        modSource project.sourceSets.main
    }

    client
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
}

// 复用 fabric-26.1.2 的业务代码与资源（26.1 渲染基线，独立工程间经相对路径引用）
sourceSets {
    main {
        java {
            srcDir file('../fabric-26.2/src/main/java')
            // 排除 Fabric 加载器入口与平台实现（NeoForge 有自己的副本）
            exclude 'io/github/openlumin/OpenLuminFabric2622Client.java'
            exclude 'io/github/openlumin/platform/Fabric2622Platform.java'
            // 排除 Fabric 侧 Mixin 副本（仅排除来自 fabric-26.1.2 目录的，NeoForge 持有自己的副本）
            exclude { it.file.path.contains('fabric-26.2') && it.file.path.contains('mixin') }
        }
        resources {
            srcDir file('../fabric-26.2/src/main/resources')
            exclude 'fabric.mod.json'
        }
    }
}

tasks.withType(ProcessResources).configureEach {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}
